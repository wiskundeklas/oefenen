<style>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='wiskunde-hoeken-51-v2';
let DB={name:'',lv:{},book:{},voice:true,sound:true};
try{const r=localStorage.getItem(KEY);if(r)DB=Object.assign(DB,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- geluid en stem ---------- */
let AC=null;
function tone(f,t,d,type,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.setValueAtTime(0.0001,AC.currentTime+t);v.gain.exponentialRampToValueAtTime(g||.12,AC.currentTime+t+.02);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);o.connect(v);v.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}catch(e){}}
function sfx(k){if(!DB.sound)return;
  if(k==='ok'){[523,659,784].forEach((f,i)=>tone(f,i*.1,.25))}
  else if(k==='no'){tone(300,0,.18,'triangle',.08);tone(260,.14,.22,'triangle',.08)}
  else if(k==='tap')tone(620,0,.07,'sine',.07);
  else if(k==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.3))}}
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^nl([-_]|$)/i.test(v.lang))}catch(e){VOICES=[]}}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function vScore(v){let n=0;if(/nl[-_]NL/i.test(v.lang))n+=3;if(/natural|online|neural|premium|enhanced|siri/i.test(v.name))n+=5;if(/colette|fenna|claire|ellen|google nederlands|female|vrouw|dena/i.test(v.name))n+=3;if(/maarten|xander|frank|ruben|arnaud/i.test(v.name))n-=2;if(v.localService)n+=1;return n}
function bestVoice(){loadVoices();if(!VOICES.length)return null;if(DB.voiceName){const m=VOICES.find(v=>v.name===DB.voiceName);if(m)return m}return VOICES.slice().sort((a,b)=>vScore(b)-vScore(a))[0]}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
let vmT=0;
function noVoiceMsg(){const m=$('#vmsg');m.textContent='Op dit apparaat is geen Nederlandse stem gevonden. Daarom lees ik niet voor. Installeer een Nederlandse stem in de instellingen van je apparaat (bij Spraak), of gebruik Microsoft Edge of Google Chrome.';m.hidden=false;clearTimeout(vmT);vmT=setTimeout(()=>{m.hidden=true},9000)}
function speak(t){if(!t)return;try{const v=bestVoice();if(!v){noVoiceMsg();return}stopSpeech();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=DB.rate||.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function listenBtn(t){const b=document.createElement('button');b.type='button';b.className='btn alt small';b.textContent='\u{1F50A} Lees voor';b.onclick=()=>speak(t);return b}
const say=s=>String(s).replace(/<[^>]+>/g,' ').replace(/∠/g,'hoek ').replace(/°/g,' graden').replace(/₁/g,' 1').replace(/₂/g,' 2').replace(/[∟┐]/g,'hoekje').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();

let S={lv:null,i:0,tries:0,pts:0,qs:[],locked:false,log:[],mode:'',t0:0,seq:[],snap:[],keep:false,saved:false,fin:false};const stage=$('#stage');

/* ---------- gedeelde hulpjes ---------- */
const O=(v,h)=>({v,h:h==null?v:h});
const chipsH=(list,sel,att,f)=>'<div class="chips">'+list.map(x=>'<button type="button" class="c2'+(String(sel)===String(x)?' sel':'')+'" '+att+'="'+x+'">'+(f?f(x):x)+'</button>').join('')+'</div>';
function build(plan,make){const seen=new Set(),out=[];let t=0;plan=shuffle(plan);
  while(out.length<plan.length&&t<800){t++;const q=make(plan[out.length]);if(!q||seen.has(q.key))continue;seen.add(q.key);out.push(q)}
  return out}
const IMGB=(f,t)=>()=>'<img class="bk" src="boek/'+f+'" alt="'+t+'"><p class="note center">'+t+'</p>';

/* ---------- hulpplaatjes bij de boekopdrachten ("Laat zien") ----------
   Elke functie geeft een stukje HTML met een plaatje en korte uitleg.
   Gebruik in een boekstap:  {t:'...', z:'...', p:'pap'}  */
const HP=(()=>{
  const INK='#17324d',BLUE='#2a6fdb',OR='#e8870a',RO='#d6336c',SOFT='#4b6580',YEL='#c99a00';
  const rd=d=>d*Math.PI/180,F=n=>(+n).toFixed(1);
  /* punt vanuit c, hoek a (graden, tegen de klok in vanaf rechts), afstand r */
  const pt=(c,a,r)=>[c[0]+r*Math.cos(rd(a)),c[1]-r*Math.sin(rd(a))];
  /* punt op een kompasroos: b = graden met de klok mee vanaf boven */
  const pb=(c,b,r)=>[c[0]+r*Math.sin(rd(b)),c[1]-r*Math.cos(rd(b))];
  const ln=(p,q,st,w,ex)=>'<line x1="'+F(p[0])+'" y1="'+F(p[1])+'" x2="'+F(q[0])+'" y2="'+F(q[1])+'" stroke="'+st+'" stroke-width="'+(w||3)+'" stroke-linecap="round"'+(ex||'')+'/>';
  const tx=(p,t,c,an)=>'<text class="'+(c||'hp-t')+'" x="'+F(p[0])+'" y="'+F(p[1])+'" text-anchor="'+(an||'middle')+'" dominant-baseline="middle">'+t+'</text>';
  const dot=(p,r,fill,st)=>'<circle cx="'+F(p[0])+'" cy="'+F(p[1])+'" r="'+r+'" fill="'+fill+'"'+(st?' stroke="'+st+'" stroke-width="2"':'')+'/>';
  /* boogje tussen twee richtingen (tegen de klok in, a1<a2) */
  const arc=(c,a1,a2,r,st,w)=>{const p=pt(c,a1,r),q=pt(c,a2,r);return '<path d="M'+F(p[0])+','+F(p[1])+' A'+r+' '+r+' 0 '+(Math.abs(a2-a1)>180?1:0)+' 0 '+F(q[0])+','+F(q[1])+'" fill="none" stroke="'+st+'" stroke-width="'+(w||3)+'" stroke-linecap="round"/>'};
  /* hoekje voor een rechte hoek */
  const sq=(c,a1,a2,s,st)=>{const p=pt(c,a1,s),q=pt(c,a2,s),m=[p[0]+q[0]-c[0],p[1]+q[1]-c[1]];return '<path d="M'+F(p[0])+','+F(p[1])+' L'+F(m[0])+','+F(m[1])+' L'+F(q[0])+','+F(q[1])+'" fill="none" stroke="'+(st||RO)+'" stroke-width="2.5" stroke-linejoin="round"/>'};
  const svg=(vb,body,alt,mw)=>'<svg class="fig" viewBox="'+vb+'" style="max-width:'+(mw||280)+'px" role="img" aria-label="'+alt+'">'+body+'</svg>';
  const num=(p,n)=>'<circle cx="'+F(p[0])+'" cy="'+F(p[1])+'" r="11" fill="'+OR+'" stroke="#fff" stroke-width="2"/>'+tx([p[0],p[1]+.5],n,'hp-n');
  const row=(s,t)=>'<div class="hrow"><div class="hsv">'+s+'</div><div class="htx">'+t+'</div></div>';
  const W=(c,t)=>'<span class="hw hw-'+c+'">'+t+'</span>';

  /* pijl met de klok mee (van b1 naar b2, kompasroos-graden) */
  function arc2(c,b1,b2,r){const p=pb(c,b1,r),q=pb(c,b2,r),t=rd(b2),u=[Math.cos(t),Math.sin(t)];
    const a1=[q[0]-u[0]*10-u[1]*5,q[1]-u[1]*10+u[0]*5],a2=[q[0]-u[0]*10+u[1]*5,q[1]-u[1]*10-u[0]*5];
    return '<path d="M'+F(p[0])+','+F(p[1])+' A'+r+' '+r+' 0 0 1 '+F(q[0])+','+F(q[1])+'" fill="none" stroke="'+OR+'" stroke-width="3" stroke-linecap="round"/><path d="M'+F(a1[0])+','+F(a1[1])+' L'+F(q[0])+','+F(q[1])+' L'+F(a2[0])+','+F(a2[1])+'" fill="none" stroke="'+OR+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'}

  /* ---- kompasroos (eenvoudig) ---- */
  function rose(c,R){let s='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+R+'" fill="rgba(238,246,255,.7)" stroke="'+INK+'" stroke-width="2"/>';

  /* ---- klok ---- */
  function clock(c,R,h,m,on){let s='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+R+'" fill="#fff" stroke="'+INK+'" stroke-width="3"/>';
    for(let i=1;i<=12;i++)s+=tx(pb(c,i*30,R-15),i,'hp-s');
    const ha=(h%12)*30+m*.5,ma=m*6;
    if(on){const d=((ma-ha)+360)%360,st=d<=180?ha:ma,sp=d<=180?d:360-d,p=pb(c,st,28),q=pb(c,st+sp,28);
      s+='<path d="M'+F(p[0])+','+F(p[1])+' A28 28 0 0 1 '+F(q[0])+','+F(q[1])+'" fill="none" stroke="'+OR+'" stroke-width="4" stroke-linecap="round"/>'}
    return s+ln(c,pb(c,ha,R*.5),BLUE,6)+ln(c,pb(c,ma,R*.76),RO,3.5)+dot(c,4.5,INK)}
  const CK=(h,m,on,alt)=>svg('0 0 200 200',clock([100,100],92,h,m,on),alt,150);

  const P={};

  /* hoek vergelijken met de rechte hoek van je geodriehoek of papier */
  P.pap=()=>{const V=[52,124];
    const one=(th,title,res,cls)=>{

      const b=tri+sq(V,0,90,15)+ln(V,[V[0]+128,V[1]],BLUE,4)+ln(V,pt(V,th,76),BLUE,4)+arc(V,0,th,34,OR,3)+dot(V,4.5,INK);

  /* een hoek meten in 4 stappen */
  P.meet4=()=>{const c=[150,148],R=104;

      +'<ol class="h4"><li>Het <b>midden</b> van de roos komt op het <b>hoekpunt</b>.</li><li>De lijn van <b>0°</b> ligt op één been.</li><li>Draai <b>met de klok mee</b> naar het andere been.</li><li><b>Lees</b> het getal af bij het andere been.</li></ol>'

  P.lees=()=>{const c=[150,140],R=104;

  /* benen verlengen */
  P.verleng=()=>{const V=[30,128],e=pt(V,100,112);
    const s='<path d="M'+(V[0]+112)+','+V[1]+' A112 112 0 0 0 '+F(e[0])+','+F(e[1])+'" fill="none" stroke="'+SOFT+'" stroke-width="2" stroke-dasharray="3 4"/>'
      +ln(V,pt(V,0,176),OR,4,' stroke-dasharray="7 6"')+ln(V,pt(V,50,160),OR,4,' stroke-dasharray="7 6"')
      +ln(V,pt(V,0,60),BLUE,5)+ln(V,pt(V,50,60),BLUE,5)+arc(V,0,50,26,RO,3)+dot(V,4.5,INK)

  /* scherp / recht / stomp op een lijn van 0° tot 180° */
  P.lijn180=()=>{const x0=24,x1=276,k=(x1-x0)/180,X=a=>x0+a*k,y=100;

    const s='<rect x="'+X(0)+'" y="'+y+'" width="'+(90*k)+'" height="28" fill="rgba(255,197,51,.5)"/><rect x="'+X(90)+'" y="'+y+'" width="'+(90*k)+'" height="28" fill="rgba(42,111,219,.28)"/>'
      +[0,90,180].map(a=>ln([X(a),y-3],[X(a),y+34],INK,2.5)+tx([X(a),y+48],a+'°','hp-t')).join('')
      +tx([X(45),y+14],'scherp','hp-t')+tx([X(135),y+14],'stomp','hp-t')+tx([X(90),y+66],'recht','hp-t')

  /* windroos met alleen letters */
  P.windroos=()=>{const c=[140,128],R=84;let s='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+R+'" fill="rgba(238,246,255,.7)" stroke="'+INK+'" stroke-width="2"/>';
    ['N','NO','O','ZO','Z','ZW','W','NW'].forEach((n,i)=>{const a=i*45,main=i%2===0;s+=ln(c,pb(c,a,R),main?INK:'#8aa3bd',main?2.5:1.5)+tx(pb(c,a,R+17),n,main?'hp-t':'hp-s')});

  P.hoekpunt=()=>{const V=[56,118];

      +tx([V[0]-8,V[1]+22],'hoekpunt','hp-t','start')+tx([V[0]+150,V[1]+18],'been','hp-t')+tx([V[0]+146,V[1]-96],'been','hp-t')+tx([V[0]+50,V[1]-12],'boogje','hp-s','start');

      +'<p class="hcap">Het <b>hoekpunt</b> is het punt waar de twee <b>benen</b> elkaar raken. Het <b>boogje</b> laat zien welke hoek bedoeld is.</p>'};

  P.klok=()=>CK(4,0,0,'Een klok op vier uur')

  P.klokslag=()=>'<div class="h2c">'+CK(2,0,0,'Klok op twee uur')+CK(8,0,0,'Klok op acht uur')+'</div>'

  P.klokhoek=()=>'<div class="h2c">'+CK(4,0,1,'Klok met een boogje tussen de wijzers')+CK(10,10,1,'Klok met een boogje tussen de wijzers')+'</div>'
    +'<p class="hcap">Het <b>boogje</b> zit tussen de twee wijzers. Dat is de hoek.<br>Staan de wijzers <b>dicht bij elkaar</b>? Dan is de hoek klein.<br>Staan ze <b>ver uit elkaar</b>? Dan is de hoek groot.</p>';
  P.klokdubbel=()=>'<div class="h2c">'+CK(1,0,1,'Klok op één uur')+CK(2,0,1,'Klok op twee uur')+'</div>'
    +'<p class="hcap">Voorbeeld: bij <b>1 uur</b> zit er <b>1 stap</b> tussen de wijzers (12 → 1).<br>Twee keer zo groot is <b>2 stappen</b>: dan staat de korte wijzer op de 2.<br>Tel zo ook bij jouw klok de stappen van de 12 tot de korte wijzer.</p>';

  /* overtrekpapier */
  P.overtrek=()=>{const V=[40,124];
    const one=(tA,tB,title,res,cls)=>{
      const A='<path d="M'+V+' L'+pt(V,0,122)+' A122 122 0 0 0 '+pt(V,tA,122)+' Z" fill="rgba(255,197,51,.36)" stroke="'+YEL+'" stroke-width="2" stroke-dasharray="6 4"/>';
      const b=A+ln(V,pt(V,0,130),BLUE,4)+ln(V,pt(V,tB,104),BLUE,4)+dot(V,4.5,INK);
      return row(svg('0 0 190 140',b,'Een hoek en een stuk overtrekpapier',190),'<b>'+title+'</b><br>∠B is '+W(cls,res)+' dan ∠A.')};
    return '<ol class="h4"><li>Trek ∠A over op overtrekpapier (het gele stuk).</li><li>Leg het op ∠B: <b>hoekpunt op hoekpunt</b>, <b>één been op één been</b>.</li><li>Kijk naar het <b>andere been</b> van ∠B.</li></ol>'
      +one(72,40,'Ligt in het papier','kleiner','s')+one(50,100,'Steekt eruit','groter','t')};

  /* tekentje voor een rechte hoek */
  P.teken=()=>{const A=[34,100],B=[206,28];
    const s=ln(A,pt(A,0,70),BLUE,4)+ln(A,pt(A,90,70),BLUE,4)+sq(A,0,90,18)+dot(A,4,INK)

    return svg('0 0 260 120',s,'Twee rechte hoeken met het tekentje',260)
      +'<p class="hcap">Het tekentje is een klein hoekje <b>in de hoek</b>, tegen het hoekpunt aan.<br><span class="sg">⌞</span> de benen gaan naar boven en naar rechts.<br><span class="sg">⌝</span> de benen gaan naar beneden en naar links.</p>'};

  /* loodrecht */
  P.loodrecht=()=>{const c=[120,64];

  P.som=()=>{const V=[40,124];

      +tx(pt(V,17,76),'E₁','hp-t')+tx(pt(V,56,76),'E₂','hp-t')+tx(pt(V,40,114),'E','hp-t');
    return svg('0 0 260 140',s,'Hoek E is verdeeld in hoek E1 en hoek E2',260)

  return P})();

/* ---------- klokken en hoeken tekenen ---------- */
const rad=d=>d*Math.PI/180;
const f1=n=>(+n).toFixed(1);
const PT=(x,y,a,r)=>[x+r*Math.cos(rad(a)),y+r*Math.sin(rad(a))];
const uurD=h=>h<=6?30*h:360-30*h;
const arcP=(x,y,a1,a2,r)=>{const p=PT(x,y,a1,r),q=PT(x,y,a2,r);return 'M'+f1(p[0])+','+f1(p[1])+' A'+r+' '+r+' 0 '+((a2-a1)>180?1:0)+' 1 '+f1(q[0])+','+f1(q[1])};
const wedgeP=(x,y,a1,a2,r)=>{const p=PT(x,y,a1,r);return 'M'+x+','+y+' L'+f1(p[0])+','+f1(p[1])+' '+arcP(x,y,a1,a2,r).replace(/^M[^A]*/,'')+' Z'};
/* een klok (120 x 120) met de wijzers van h uur */
function clockG(h,x,lab){let s='<g transform="translate('+(x||0)+',0)"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#17324d" stroke-width="3"/>';
  for(let i=0;i<60;i++){const a=i*6-90,L=i%5===0?5:2.5,p=PT(60,60,a,50),q=PT(60,60,a,50-L);s+='<line x1="'+f1(p[0])+'" y1="'+f1(p[1])+'" x2="'+f1(q[0])+'" y2="'+f1(q[1])+'" stroke="#17324d" stroke-width="'+(i%5===0?1.4:.6)+'"/>'}
  for(let i=1;i<=12;i++){const p=PT(60,60,i*30-90,38);s+='<text x="'+f1(p[0])+'" y="'+f1(p[1])+'" text-anchor="middle" dominant-baseline="central" style="font:600 10px Lexend,sans-serif;fill:#17324d">'+i+'</text>'}
  const ah=h*30-90,a1=h<=6?-90:ah,a2=h<=6?ah:270;
  s+='<path d="'+wedgeP(60,60,a1,a2,24)+'" fill="rgba(214,51,108,.22)"/><path d="'+arcP(60,60,a1,a2,24)+'" fill="none" stroke="#d6336c" stroke-width="3"/>';
  const m=PT(60,60,-90,43),hh=PT(60,60,ah,28);
  s+='<line x1="60" y1="60" x2="'+f1(m[0])+'" y2="'+f1(m[1])+'" stroke="#2a6fdb" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="60" x2="'+f1(hh[0])+'" y2="'+f1(hh[1])+'" stroke="#17324d" stroke-width="5.5" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="#d6336c"/>';
  if(lab)s+='<text x="60" y="134" text-anchor="middle" style="font:700 14px Lexend,sans-serif;fill:#17324d">'+lab+'</text>';
  return s+'</g>'}
const clockSvg=(h,max)=>'<svg class="fig" viewBox="0 0 120 120" style="max-width:'+(max||200)+'px" role="img" aria-label="Een klok met wijzers">'+clockG(h)+'</svg>';
const clocksRow=(hs,labs)=>'<svg class="fig" viewBox="0 0 '+(hs.length*128)+' 142" style="max-width:'+Math.min(420,hs.length*140)+'px" role="img" aria-label="Klokken met wijzers">'+hs.map((h,i)=>clockG(h,i*128+4,labs[i])).join('')+'</svg>';
/* een hoek: x,y = hoekpunt, a1 = richting van het eerste been (graden, 0 = rechts, met de klok mee), d = grootte */
function angG(o){const x=o.x,y=o.y,a1=o.a1,a2=o.a1+o.d,L=o.len||40,col=o.col||'#2a6fdb',r=o.r||Math.min(18,L*.45);
  const p=PT(x,y,a1,L),q=PT(x,y,a2,L);let s='';
  if(!o.noArc)s+='<path d="'+wedgeP(x,y,a1,a2,r)+'" fill="'+(o.fill||'rgba(42,111,219,.15)')+'"/><path d="'+arcP(x,y,a1,a2,r)+'" fill="none" stroke="'+(o.arcCol||'#d6336c')+'" stroke-width="'+(o.arcW||2.5)+'"/>';
  s+='<line x1="'+x+'" y1="'+y+'" x2="'+f1(p[0])+'" y2="'+f1(p[1])+'" stroke="'+(o.col1||col)+'" stroke-width="'+(o.w||3.5)+'" stroke-linecap="round"/><line x1="'+x+'" y1="'+y+'" x2="'+f1(q[0])+'" y2="'+f1(q[1])+'" stroke="'+(o.col2||col)+'" stroke-width="'+(o.w||3.5)+'" stroke-linecap="round"/>';
  if(!o.noDot)s+='<circle cx="'+x+'" cy="'+y+'" r="'+(o.dot||3.2)+'" fill="'+(o.dotCol||'#17324d')+'"/>';

  LV.forEach((l,i)=>{const r=DB.lv[i];h+='<button class="lvb'+(r&&r.done?' done':'')+'" data-i="'+i+'" type="button"><span class="lvn">'+(i+1)+'</span><span><b>'+l.t+'</b><small>'+l.sub+'</small></span><span class="st">'+(r&&r.done?starTxt(starsOf(r.pts,l.n||5))+'<small>'+r.pts+' van '+(l.n||5)+'</small>':'')+'</span></button>'});
  const nb=Object.keys(DB.book).length;
  h+='<button class="lvb bk" id="bk" type="button"><span class="lvn">\u{1F4D6}</span><span><b>Opdrachten uit je boek</b><small>Stap voor stap · '+nb+' van '+BOOK.length+' klaar</small></span></button>';
  h+='<button class="lvb tt'+(T?' done':'')+'" id="tt" type="button"><span class="lvn">\u{26A1}</span><span><b>Snelle toets</b><small>Hoeveel procent weet jij?'+(T?' · laatste: '+T.last+'%':'')+'</small></span><span class="st">'+(T?T.best+'%':'')+'</span></button></div>';
  h+='<div class="row"><button class="btn alt small" id="rs" type="button">Opnieuw beginnen</button><span class="note" id="rsn"></span></div></div>';
  stage.innerHTML=h;$$('.lvb[data-i]').forEach(b=>b.onclick=()=>explain(+b.dataset.i,0));$('#bk').onclick=bookMenu;$('#tt').onclick=toetsIntro;
  let armed=0;$('#rs').onclick=function(){if(!armed){armed=1;$('#rsn').textContent='Zeker weten? Tik nog een keer. Je punten en je naam worden gewist.';setTimeout(()=>{armed=0;$('#rsn').textContent=''},4000)}else{DB={name:'',lv:{},book:{},toets:null,voice:DB.voice,sound:DB.sound,rate:DB.rate,voiceName:DB.voiceName};save();nameScreen()}}}
function explain(i,k){S.lv=i;S.mode='';stopSpeech();topbar(true);setProg(null);const L=LV[i],st=L.steps[k];
  const paras=st.txt.split('\n').map(p=>'<div class="say">'+p+'</div>').join('');
  stage.innerHTML='<div class="card"><div class="qhead"><span>Onderdeel '+(i+1)+': '+L.t+'</span><span>'+(k+1)+' van '+L.steps.length+'</span></div><h2>'+st.h+'</h2>'+paras+(st.fig?'<div>'+st.fig()+'</div>':'')+(st.w?'<div class="wd" id="wd"></div>':'')+'<div class="row"><span id="lis"></span></div>'+navHtml()+'</div>';
  if(st.w)WID[st.w]($('#wd'),st.o);
  $('#lis').appendChild(listenBtn(say(st.h+'. '+st.txt.replace(/\n/g,' '))));
  wireNav(k?()=>explain(i,k-1):null,null);
  setMain(k<L.steps.length-1?'Volgende →':'Naar de vragen →',()=>{if(k<L.steps.length-1)explain(i,k+1);else if(S.keep&&S.lv===i&&!S.fin){showQ()}else startQuiz(i)});
  window.scrollTo(0,0)}
/* ----- vragen ----- */
function startQuiz(i){S={lv:i,i:0,tries:0,pts:0,qs:LV[i].gen(),locked:false,log:[],mode:'quiz',t0:0,seq:[],snap:[],keep:true,saved:false,fin:false,one:false};showQ()}
function progress(){const L=S.qs.length;let h='';for(let i=0;i<L;i++){h+='<i style="display:inline-block;width:20px;height:20px;margin:0 2px;border-radius:50%;border:3px solid '+(i<S.log.length?(S.log[i].pts?'#4aa83a':'#e8883a'):(i===S.i?'#2a6fdb':'#c4dcf2'))+';background:'+(i<S.log.length?(S.log[i].pts?'#7ed36a':'#ffb066'):'#fff')+'"></i>'}return '<div class="center" style="margin:4px 0 10px">'+h+'</div>'}
function showQ(){stopSpeech();window.scrollTo(0,0);S.fin=false;topbar(true);const q=S.qs[S.i],n=S.qs.length,tt=S.mode==='toets';setProg(S.i/n*100);
  const lastLab=S.i===n-1?'Klaar ▶':'Volgende →';
  if(S.snap[S.i]){stage.innerHTML=S.snap[S.i];S.locked=true;$('#lis').innerHTML='';$('#lis').appendChild(listenBtn(q.say||say(q.text)));wireNav(qPrev,askMenu);setMain(lastLab,qNext,false,true);return}
  S.t0=Date.now();S.tries=0;S.locked=false;S.seq=[];
  let h='<div class="card"><div class="qhead"><span>'+(tt?'⚡ Snelle toets':LV[S.lv].t)+'</span><span>Vraag '+(S.i+1)+' van '+n+'</span></div>'+progress();
  if(q.fig)h+=q.fig;
  h+='<div class="q">'+q.text+'</div><div id="ans">';
  if(q.type==='mc')h+='<div class="opts'+(q.two?' two':'')+(q.four?' four':'')+'">'+q.opts.map(o=>'<button class="opt" type="button" data-v="'+esc(o.v)+'">'+o.h+'</button>').join('')+'</div>';
  else if(q.type==='order'){const cs=shuffle(q.cards.map((c,i)=>i));h+='<div class="opts'+(q.cols?' c3':'')+'" id="ord">'+cs.map(i=>'<button class="opt" type="button" data-v="'+i+'">'+q.cards[i].h+'<span class="nb" hidden></span></button>').join('')+'</div>'}
  else if(q.type==='custom')h+='<div id="cq"></div>';
  h+='</div><div id="fbk" role="status" aria-live="polite"></div><div class="row"><span id="lis"></span></div>'+navHtml()+'</div>';
  stage.innerHTML=h;$('#lis').appendChild(listenBtn(q.say||say(q.text)));
  wireNav(qPrev,askMenu);setMain(lastLab,qNext,true);
  if(q.type==='mc')$$('.opt').forEach(b=>b.onclick=()=>judge(b.dataset.v===q.ans,b));
  else if(q.type==='custom')q.mount($('#cq'),(ok,msg)=>judge(ok,null,msg));
  else if(q.type==='order')$$('#ord > button').forEach(b=>b.onclick=()=>{if(S.locked||S.seq.includes(+b.dataset.v))return;sfx('tap');S.seq.push(+b.dataset.v);const nb=$('.nb',b);nb.hidden=false;nb.textContent=S.seq.length;b.classList.add('sel');
    if(S.seq.length===q.cards.length){const ok=S.seq.every((v,i)=>q.cards[v].r===i);if(ok)judge(true);else{judge(false,null,'Nog niet goed. De volgorde klopt niet.'+(S.one?'':' Begin opnieuw.'));if(!S.locked){S.seq=[];$$('#ord > button').forEach(x=>{x.classList.remove('sel');$('.nb',x).hidden=true})}}}})}
function fb(k,t){$('#fbk').innerHTML='<div class="fb '+k+'">'+t+'</div>'}
function judge(ok,btn,msg){if(S.locked)return;const q=S.qs[S.i];
  if(ok){S.locked=true;sfx('ok');const aw=S.tries===0?1:0,sec=Math.round((Date.now()-S.t0)/1000);S.pts+=aw;S.log.push({pts:aw,sec,part:q.part});topbar(true);if(btn)btn.classList.add('ok');
    fb('ok',pick(KNOP_OK)+(S.one?'':' '+(aw?'+1 punt':'Geen punt, want het was niet de eerste keer goed.')));endQ()}
  else{if(S.one)S.tries=2;S.tries++;sfx('no');if(btn){btn.classList.add('no');btn.disabled=true}
    if(S.tries===1)fb('no',msg||'Nog niet goed. Probeer het nog een keer.');
    else if(S.tries===2)$('#fbk').innerHTML='<div class="fb no">'+(msg||'Nog niet goed.')+'</div><div class="fb tip">'+q.tip+'</div>';
    else{S.locked=true;const sec=Math.round((Date.now()-S.t0)/1000);S.log.push({pts:0,sec,part:q.part});
      if(q.type==='mc')$$('.opt').forEach(b=>{if(b.dataset.v===q.ans)b.classList.add('ok')});
      if(q.type==='order'){const o=q.cards.map((c,i)=>i).sort((a,b)=>q.cards[a].r-q.cards[b].r);$$('#ord > button').forEach(b=>{const nb=$('.nb',b);nb.hidden=false;nb.textContent=o.indexOf(+b.dataset.v)+1})}
      if(q.reveal)q.reveal($('#cq'));
      $('#fbk').innerHTML='<div class="fb no">Het goede antwoord is: '+q.show+'</div>'+(S.one?'':'<div class="fb tip">'+q.tip+'</div>');endQ()}}}
function endQ(){$$('.opt').forEach(b=>b.disabled=true);setMain(S.i===S.qs.length-1?'Klaar ▶':'Volgende →',qNext,false,true);$('#bMain').focus()}
function finish(){setProg(100);window.scrollTo(0,0);const i=S.lv,p=S.pts,n=S.qs.length,old=DB.lv[i]||{};
  const tot=S.log.reduce((a,x)=>a+x.sec,0);
  if(!S.saved){S.saved=true;DB.lv[i]={done:true,pts:Math.max(old.pts||0,p),last:p,time:tot,n:(old.n||0)+1};save()}
  S.mode='';S.fin=true;topbar(true);sfx('win');
  const s=starsOf(p,n),r=p/n,all=LV.every((_,j)=>DB.lv[j]&&DB.lv[j].done);
  let h='<div class="card center"><h1>Onderdeel '+(i+1)+' klaar!</h1><div class="stars">'+starTxt(s)+'</div><p class="big">'+p+' van '+n+' meteen goed</p><p>'+(r>=.9?'Fantastisch!':r>=.7?'Heel goed gedaan!':r>=.5?'Goed bezig. Probeer nog een keer voor meer sterren.':'Blijf oefenen, dan wordt het steeds makkelijker.')+'</p>';
  if(all)h+='<div class="fb ok">Alle '+LV.length+' onderdelen klaar! '+totalPts()+' van '+NQ+' punten.</div>';
  h+='<div class="row" style="justify-content:center"><button class="btn alt" id="ag" type="button">Nog een keer</button></div>'+navHtml()+'</div>';
  stage.innerHTML=h;$('#ag').onclick=()=>startQuiz(i);
  wireNav(()=>{S.i=n-1;S.mode='quiz';showQ()},null);
  if(i<LV.length-1)setMain('Volgende →',()=>explain(i+1,0));else setMain('Naar het boek ▶',bookMenu)}
/* ----- opdrachten uit het boek: alleen stappen ----- */
function bookMenu(){S.mode='';S.keep=false;S.fin=false;stopSpeech();topbar(true);setProg(null);window.scrollTo(0,0);
  const pages=[...new Set(BOOK.map(b=>b.page))];
  let h='<div class="card"><h1>Opdrachten uit je boek</h1><div class="where">Pak je boek. Zoek <b>'+PAD+'</b>. Kies de opdracht waar je mee bezig bent.</div>';
  pages.forEach(pg=>{h+='<h3>Bladzijde '+pg+'</h3><div class="lv">'+BOOK.filter(b=>b.page===pg).map(b=>'<button class="lvb bk" data-id="'+b.id+'" type="button"><span class="lvn" style="font-size:.95rem">'+b.nr+'</span><span><b>Opdracht '+b.nr+'</b><small>'+b.title+'</small></span><span class="st">'+(DB.book[b.id]?'✓':'')+'</span></button>').join('')+'</div>'});
  h+=navHtml()+'</div>';
  stage.innerHTML=h;$$('.lvb[data-id]').forEach(b=>b.onclick=()=>bookEx(b.dataset.id));
  wireNav(()=>{S.lv=LV.length-1;explain(LV.length-1,LV[LV.length-1].steps.length-1)},null);setMain('Eerste opdracht →',()=>bookEx(BOOK[0].id))}
const NEED={geodriehoek:'\u{1F4D0} geodriehoek',kompasroos:'\u{1F9ED} kompasroos',potlood:'\u270F\uFE0F potlood',liniaal:'\u{1F4CF} liniaal',overtrekpapier:'\u{1F4C4} overtrekpapier',rood:'\u{1F58D}\uFE0F rood potlood',schrift:'\u{1F4D3} je schrift'};
const stOf=s=>typeof s==='string'?{t:s}:s;
function stepHtml(s,i){const z=s.z?'<div class="zo"><b>Zo doe je dat:</b> '+s.z+'</div>':'',w=s.s?'<div class="sch"><b>Schrijf op:</b> '+s.s+'</div>':'',p=s.p&&HP[s.p]?'<button class="btn alt small show" type="button" data-p="'+s.p+'">\u{1F440} Laat zien</button><div class="pic" hidden></div>':'';
  return '<div class="bstp" data-k="'+i+'"><div class="sh" role="button" tabindex="0" aria-pressed="false"><span class="n">'+(i+1)+'</span><b class="st">'+s.t+'</b></div>'+((z||w||p)?'<div class="bd">'+z+w+p+'</div>':'')+'</div>'}
function bookEx(id){stopSpeech();topbar(true);setProg(null);S.mode='';const B=BOOK.find(x=>x.id===id),ix=BOOK.indexOf(B),isL=ix===BOOK.length-1,file='boek/p'+B.page+'-opdracht-'+B.nr+'.png',ST=B.steps.map(stOf);
  stage.innerHTML='<div class="card"><div class="badges"><span class="badge">Bladzijde '+B.page+'</span><span class="badge o">Opdracht '+B.nr+'</span></div><h2>'+B.title+'</h2>'
   +'<div class="where">Pak je boek. Sla open <b>bladzijde '+B.page+'</b> en zoek <b>opdracht '+B.nr+'</b>.</div>'
   +'<a href="'+file+'" target="_blank" rel="noopener"><img class="bk" src="'+file+'" alt="Opdracht '+B.nr+' uit je boek, bladzijde '+B.page+'"></a><p class="note center" style="margin:0">Tik op de afbeelding om groter te zien.</p>'
   +'<h3>Wat moet je doen?</h3>'+(B.doel?'<p class="doel">'+B.doel+'</p>':'')
   +(B.need?'<div class="need"><b>Pak:</b> '+B.need.map(n=>'<span class="nd">'+(NEED[n]||n)+'</span>').join('')+'</div>':'')
   +'<h3>Stap voor stap</h3><p class="note" style="margin:0 0 6px">Tik op het rondje als je een stap gedaan hebt.</p><div id="sts">'+ST.map(stepHtml).join('')+'</div><div id="sd"></div>'
   +'<div class="row"><span id="lis"></span></div>'+navHtml()+'</div>';
  $('#lis').appendChild(listenBtn(say('Opdracht '+B.nr+'. '+B.title+'. '+(B.doel||'')+' '+ST.map((s,i)=>'Stap '+(i+1)+'. '+s.t+'. '+(s.z?'Zo doe je dat. '+s.z+' ':'')+(s.s?'Schrijf op. '+s.s:'')).join(' '))));
  const upd=()=>{const n=$$('#sts .bstp.done').length;$('#sd').innerHTML=n===ST.length?'<div class="fb ok">Opdracht '+B.nr+' klaar! Goed gedaan.</div>':'';if(n===ST.length&&!DB.book[B.id]){DB.book[B.id]=1;save();sfx('win')}};
  $$('#sts .bstp').forEach(el=>{const sh=$('.sh',el),tg=()=>{sfx('tap');const d=el.classList.toggle('done');sh.setAttribute('aria-pressed',d?'true':'false');$('.n',sh).textContent=d?'\u2713':(+el.dataset.k+1);upd()};
    sh.onclick=tg;sh.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    const b=$('.show',el);if(b){const pc=$('.pic',el);b.onclick=()=>{sfx('tap');if(pc.hidden){if(!pc.innerHTML)pc.innerHTML=HP[b.dataset.p]();pc.hidden=false;b.textContent='\u{1F648} Verberg plaatje'}else{pc.hidden=true;b.textContent='\u{1F440} Laat zien'}}}});
  wireNav(()=>ix>0?bookEx(BOOK[ix-1].id):bookMenu(),null);
  setMain(isL?'Naar de toets \u25B6':'Volgende opdracht \u2192',()=>{if(!DB.book[B.id]){DB.book[B.id]=1;save()}isL?toetsIntro():bookEx(BOOK[ix+1].id)},false,isL);
  window.scrollTo(0,0)}
/* ----- snelle toets ----- */
function toetsIntro(){S.mode='';S.keep=false;S.fin=false;stopSpeech();topbar(true);setProg(null);window.scrollTo(0,0);const T=DB.toets;
  stage.innerHTML='<div class="card center"><h1>⚡ Snelle toets</h1><p class="big">10 vragen</p><p>Je hebt 1 kans per vraag. Aan het eind zie je hoeveel procent je weet van deze les.</p>'+(T?'<div class="fb ok">Laatste keer: <b>'+T.last+'%</b> · Beste: <b>'+T.best+'%</b></div>':'')+navHtml()+'</div>';
  wireNav(()=>bookEx(BOOK[BOOK.length-1].id),null);setMain(T?'Toets opnieuw ▶':'Start de toets ▶',startToets,false,true)}
function startToets(){S={lv:null,i:0,tries:0,pts:0,qs:TOETS(),locked:false,log:[],mode:'toets',t0:0,seq:[],snap:[],keep:false,saved:false,fin:false,one:true};showQ()}
function toetsDone(){setProg(100);window.scrollTo(0,0);const n=S.qs.length,p=S.pts,pct=Math.round(p/n*100),old=DB.toets||{};
  if(!S.saved){S.saved=true;DB.toets={last:pct,best:Math.max(old.best||0,pct),n:(old.n||0)+1};save()}
  S.mode='';S.fin=true;topbar(true);sfx('win');
  const kl=pct>=90?'good':pct>=60?'mid':'low',msg=pct>=90?'Wauw! Je weet bijna alles van deze les.':pct>=70?'Goed! Je weet de meeste dingen.':pct>=50?'Je bent op weg. Oefen de onderdelen hieronder nog een keer.':'Nog even oefenen. Doe de onderdelen hieronder nog een keer.';
  const miss={};S.log.forEach(x=>{if(x.part!=null&&!x.pts)miss[x.part]=(miss[x.part]||0)+1});
  const weak=Object.keys(miss).map(Number).sort((a,b)=>a-b);
  let h='<div class="card center"><h1>Jouw resultaat</h1><div class="pct '+kl+'">'+pct+'%</div><p class="big">'+p+' van '+n+' goed</p><p>'+msg+'</p>';
  if(weak.length)h+='<div style="text-align:left"><h3>Oefen nog een keer</h3><div class="lv">'+weak.map(j=>'<button class="lvb" data-w="'+j+'" type="button"><span class="lvn">'+(j+1)+'</span><span><b>'+LV[j].t+'</b><small>'+miss[j]+' fout</small></span></button>').join('')+'</div></div>';
  else h+='<div class="fb ok">Alles goed! Je hoeft niets meer te oefenen.</div>';
  h+='<div class="row" style="justify-content:center"><button class="btn alt" id="ag" type="button">Toets opnieuw</button></div>'+navHtml()+'</div>';
  stage.innerHTML=h;$('#ag').onclick=startToets;$$('[data-w]').forEach(b=>b.onclick=()=>explain(+b.dataset.w,0));
  wireNav(()=>{S.i=n-1;S.mode='toets';showQ()},null);setMain('Naar het menu ▶',menu,false,true)}
window.BR={S:()=>S,LV,BOOK,M,WID,TOETS};
if(DB.name)menu();else nameScreen();

</script></body></html>
