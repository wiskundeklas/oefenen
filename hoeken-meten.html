<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3ff;--ink:#17324d;--soft:#4b6580;--blue:#2a6fdb;--blue2:#1d57b3;--orange:#e8870a;--good:#1d8a4a;--goodbg:#dff3e6;--oops:#c0392b;--oopsbg:#fde7e3;--card:#fff;--line:#c4dcf2;--yel:#ffc533;--rood:#d6336c}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Lexend,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 60px}
header.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.who{display:flex;align-items:center;gap:10px;font-weight:600;flex:1;min-width:140px}.who svg{width:44px;height:44px}
.chip{border:0;border-radius:999px;padding:8px 14px;font:600 14px Lexend,sans-serif;background:var(--blue);color:#fff;cursor:pointer;min-height:40px}
.chip.pts{background:var(--yel);color:#4a3200;cursor:default}
.prog{height:12px;border-radius:99px;background:#c4dcf2;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 18px 20px;margin-bottom:14px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .4em}h2{font-size:1.4rem;margin:.2em 0 .5em}h3{font-size:1.1rem;margin:.9em 0 .3em}
p{margin:.5em 0}.note{color:var(--soft);font-size:.9rem}.center{text-align:center}
.btn{border:0;border-radius:14px;padding:12px 20px;font:600 1.05rem Lexend,sans-serif;background:var(--blue);color:#fff;cursor:pointer;min-height:50px;box-shadow:0 3px 0 var(--blue2)}
.btn:active{transform:translateY(2px);box-shadow:none}.btn:disabled{opacity:.5;box-shadow:none;cursor:default}
.btn.alt{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}.btn.small{min-height:40px;padding:6px 14px;font-size:.95rem}
.btn.good{background:var(--good);box-shadow:0 3px 0 #146b37}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.row.sp{justify-content:space-between}
.qhead{display:flex;justify-content:space-between;gap:8px;color:var(--soft);font-size:.9rem;font-weight:600}
.q{font-size:1.2rem;font-weight:600;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.opts.two{grid-template-columns:1fr 1fr}.opts.four{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font:600 1.05rem Lexend,sans-serif;color:var(--ink);cursor:pointer;text-align:left;min-height:54px}
.opt:hover{border-color:var(--blue)}.opt.ok{background:var(--goodbg);border-color:var(--good)}.opt.no{background:var(--oopsbg);border-color:var(--oops);opacity:.8}
.opt svg{display:block;margin:0 auto;width:90px;height:auto}.opts.sg .opt{text-align:center}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600}.fb.ok{background:var(--goodbg);color:#0f5a2c}.fb.no{background:var(--oopsbg);color:#7a2118}.fb.tip{background:#fff6d9;color:#5a4300;font-weight:400}
.say{background:#f1f7ff;border-left:5px solid var(--blue);border-radius:10px;padding:10px 14px;margin:12px 0}
.big{font-weight:700;font-size:1.3em}
.kw{background:#fff0b3;border-radius:6px;padding:0 6px;font-weight:700}
.fig{display:block;width:100%;margin:6px auto;touch-action:manipulation}.fig.ang{max-width:260px}.fig.poly{max-width:260px}
.ray{stroke:var(--ink);stroke-width:4;stroke-linecap:round}.ray2{stroke:var(--blue);stroke-width:4;stroke-linecap:round}.ray.ghost{stroke:#9bb;stroke-dasharray:6 6;stroke-width:3}
.arc{fill:none;stroke:var(--orange);stroke-width:3}.sgn{fill:none;stroke:var(--rood);stroke-width:3;stroke-linejoin:round}
.geo{fill:rgba(255,197,51,.38);stroke:#b88600;stroke-width:3;stroke-linejoin:round}
.vd{fill:var(--ink)}.pg{fill:#eaf4ff;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}.lt{font:700 13px Lexend,sans-serif;fill:var(--ink)}
.hd{fill:var(--orange);stroke:#fff;stroke-width:3;cursor:grab}.dr{touch-action:none;user-select:none;-webkit-user-select:none}
.vtx{fill:#fff;stroke:var(--blue);stroke-width:3;cursor:pointer}.vtx.sel{fill:var(--orange)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.acard{position:relative;border:2px solid var(--line);background:#fff;border-radius:14px;padding:4px 4px 8px;cursor:pointer;font:inherit;color:inherit;text-align:center}
.acard:hover{border-color:var(--blue)}.acard.ok{background:var(--goodbg);border-color:var(--good)}.acard.no{background:var(--oopsbg);border-color:var(--oops);opacity:.8}
.acard b{display:block}.acard .nb{position:absolute;top:6px;right:8px;background:var(--blue);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700}
.acard .fig{max-width:150px}.acard.sel{border-color:var(--blue);background:#eef5ff}
.mrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.mrow .fig{max-width:110px;margin:0}
.mrow .tri{display:flex;gap:6px;flex-wrap:wrap}.mrow .tri button{flex:1;min-width:70px;border:2px solid var(--line);background:#fff;border-radius:12px;font:600 .95rem Lexend,sans-serif;padding:8px 4px;cursor:pointer;min-height:44px;color:var(--ink)}
.mrow .tri button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}.mrow .tri button.ok{background:var(--goodbg);border-color:var(--good);color:var(--ink)}.mrow .tri button.no{background:var(--oopsbg);border-color:var(--oops);color:var(--ink)}
.slider{width:100%;height:44px;accent-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.c2{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:600 1rem Lexend,sans-serif;color:var(--ink);cursor:pointer;min-height:42px}.c2.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.wd{background:#f6faff;border:2px dashed var(--line);border-radius:16px;padding:12px;margin:12px 0}
.verd{text-align:center;font-weight:700;font-size:1.25rem;min-height:1.6em}
.lv{display:grid;gap:10px;margin-top:10px}.lvb{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.lvb:hover{border-color:var(--blue)}.lvb b{display:block}.lvb small{color:var(--soft)}.lvn{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}.lvb.done .lvn{background:var(--good)}
.lvb .st{margin-left:auto;color:#e5a400;font-size:1.3rem;white-space:nowrap}
.lvb.bk{border-color:var(--orange);background:#fff8ec}.lvb.bk .lvn{background:var(--orange)}
.stars{font-size:2.4rem;text-align:center;letter-spacing:6px;color:#e5a400}
input.nm{font:600 1.2rem Lexend,sans-serif;width:100%;padding:12px;border:3px solid var(--line);border-radius:14px;color:var(--ink)}
.lg{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:6px}.lg th,.lg td{text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.badge{background:var(--blue);color:#fff;border-radius:12px;padding:6px 14px;font-weight:700}.badge.o{background:var(--orange)}
.where{background:#fff6d9;border:2px solid #f0d27a;border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:600}
.stp{display:flex;gap:10px;align-items:flex-start;background:#f1f7ff;border-radius:12px;padding:10px 12px;margin:8px 0}.stp .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center}
.ans{background:var(--goodbg);border:2px solid var(--good);border-radius:14px;padding:12px 14px;margin:10px 0}.ans ul{margin:.3em 0 0;padding-left:1.2em}
img.bk{display:block;width:100%;border-radius:12px;border:2px solid var(--line);margin:8px 0}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}.pop{animation:pop .35s}
.nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:10px 0 4px;margin-top:14px;background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0))}
.nav .btn{padding:10px 6px;font-size:1rem;min-height:52px}
.rn{font:600 10.5px Lexend,sans-serif;fill:#17324d}.rl{font:700 11px Lexend,sans-serif;fill:#8aa3bd}
.bub{font:700 14px Lexend,sans-serif;fill:#b35f00;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.opt.sel{border-color:var(--blue);background:#eef5ff}.opt .nb{margin-left:8px;background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-grid;place-items:center;font-weight:700}
.vt:hover circle{fill:#ffe9b0}
.qhead span:last-child{white-space:nowrap}

 <div class="who"><span id="av"></span><span id="nm"></span></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='wiskunde-hoeken-meten-v1';
let DB={name:'',lv:{},book:{},voice:true,sound:true};
try{const r=localStorage.getItem(KEY);if(r)DB=Object.assign(DB,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- geluid en stem ---------- */
let AC=null;
function tone(f,t,d,type,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.setValueAtTime(0.0001,AC.currentTime+t);v.gain.exponentialRampToValueAtTime(g||.12,AC.currentTime+t+.02);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);o.connect(v);v.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}catch(e){}}
function sfx(k){if(!DB.sound)return;
  if(k==='ok'){[523,659,784].forEach((f,i)=>tone(f,i*.1,.25))}
  else if(k==='no'){tone(300,0,.18,'triangle',.08);tone(260,.14,.22,'triangle',.08)}
  else if(k==='tap')tone(620,0,.07,'sine',.07);
  else if(k==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.3))}}
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^nl([-_]|$)/i.test(v.lang))}catch(e){VOICES=[]}}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function vScore(v){let n=0;if(/nl[-_]NL/i.test(v.lang))n+=3;if(/natural|online|neural|premium|enhanced|siri/i.test(v.name))n+=5;if(/colette|fenna|claire|ellen|google nederlands|female|vrouw|dena/i.test(v.name))n+=3;if(/maarten|xander|frank|ruben|arnaud/i.test(v.name))n-=2;if(v.localService)n+=1;return n}
function bestVoice(){loadVoices();if(!VOICES.length)return null;if(DB.voiceName){const m=VOICES.find(v=>v.name===DB.voiceName);if(m)return m}return VOICES.slice().sort((a,b)=>vScore(b)-vScore(a))[0]}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
let vmT=0;
function noVoiceMsg(){const m=$('#vmsg');m.textContent='Op dit apparaat is geen Nederlandse stem gevonden. Daarom lees ik niet voor. Installeer een Nederlandse stem in de instellingen van je apparaat (bij Spraak), of gebruik Microsoft Edge of Google Chrome.';m.hidden=false;clearTimeout(vmT);vmT=setTimeout(()=>{m.hidden=true},9000)}
function speak(t){if(!t)return;try{const v=bestVoice();if(!v){noVoiceMsg();return}stopSpeech();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=DB.rate||.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function listenBtn(t){const b=document.createElement('button');b.type='button';b.className='btn alt small';b.textContent='\u{1F50A} Lees voor';b.onclick=()=>speak(t);return b}
const say=s=>String(s).replace(/<[^>]+>/g,' ').replace(/∠/g,'hoek ').replace(/°/g,' graden').replace(/₁/g,' 1').replace(/₂/g,' 2').replace(/[∟┐]/g,'hoekje').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();

let S={lv:null,i:0,tries:0,pts:0,qs:[],locked:false,log:[],mode:'',t0:0,seq:[],snap:[],keep:false,saved:false,fin:false};const stage=$('#stage');
/* ---------- meetkunde: kompasroos en hoeken ---------- */
const rad=d=>d*Math.PI/180;
const f1=n=>(+n).toFixed(1);
const N360=b=>((b%360)+360)%360;
const RC=[130,130],RR=100;
const PB=(C,b,r)=>[C[0]+r*Math.sin(rad(b)),C[1]-r*Math.cos(rad(b))];
const cls=d=>Math.abs(d-90)<.5?'recht':d<90?'scherp':'stomp';
const ADJ={recht:'rechte',scherp:'scherpe',stomp:'stompe'};
const O=(v,h)=>({v,h:h==null?v:h});
const O3=()=>[O('recht','Recht'),O('scherp','Scherp'),O('stomp','Stomp')];
function build(plan,make){const seen=new Set(),out=[];let t=0;plan=shuffle(plan);
  while(out.length<plan.length&&t<800){t++;const q=make(plan[out.length]);if(!q||seen.has(q.key))continue;seen.add(q.key);out.push(q)}
  return out}
function roseInner(){const C=RC,R=RR;let s='<circle cx="130" cy="130" r="100" fill="rgba(238,246,255,.55)" stroke="#17324d" stroke-width="2"/><circle cx="130" cy="130" r="72" fill="rgba(255,255,255,.35)" stroke="#9fbbd6" stroke-width="1"/>';
  s+='<line x1="130" y1="58" x2="130" y2="202" stroke="#c4dcf2" stroke-width="1"/><line x1="58" y1="130" x2="202" y2="130" stroke="#c4dcf2" stroke-width="1"/>';
  for(let a=0;a<360;a+=5){const L=a%30===0?14:a%10===0?9:5,p=PB(C,a,R),q=PB(C,a,R-L);s+='<line x1="'+f1(p[0])+'" y1="'+f1(p[1])+'" x2="'+f1(q[0])+'" y2="'+f1(q[1])+'" stroke="#17324d" stroke-width="'+(a%10===0?1.4:.8)+'"/>'}
  for(let a=0;a<360;a+=30){const p=PB(C,a,R-23);s+='<text class="rn" text-anchor="middle" dominant-baseline="middle" x="'+f1(p[0])+'" y="'+f1(p[1])+'">'+a+'</text>'}
  [['N',0],['O',90],['Z',180],['W',270]].forEach(x=>{const p=PB(C,x[1],R-47);s+='<text class="rl" text-anchor="middle" dominant-baseline="middle" x="'+f1(p[0])+'" y="'+f1(p[1])+'">'+x[0]+'</text>'});
  return s}
function arcD(b1,b2,r){let d=N360(b2-b1);const p=PB(RC,b1,r),q=PB(RC,b2,r);return 'M'+f1(p[0])+','+f1(p[1])+' A'+r+' '+r+' 0 '+(d>180?1:0)+' 1 '+f1(q[0])+','+f1(q[1])}
function sqD(b1,b2,s){const p=PB(RC,b1,s),q=PB(RC,b2,s),m=[p[0]+q[0]-RC[0],p[1]+q[1]-RC[1]];return 'M'+f1(p[0])+','+f1(p[1])+' L'+f1(m[0])+','+f1(m[1])+' L'+f1(q[0])+','+f1(q[1])}
/* o: legs [{b,col,w,len}], rot (graden), noRose, hl [{b,t}], arc [b1,b2], arcs [{a:[b1,b2],r,col}], right (vierkantje), name (hoekletter), max, id, rid, aria, ends [{b,t}], full (vaste kijkdoos) */
function roseSvg(o){o=o||{};const nr=!!o.noRose;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(x,y,m)=>{m=m||0;x0=Math.min(x0,x-m);y0=Math.min(y0,y-m);x1=Math.max(x1,x+m);y1=Math.max(y1,y+m)};
  add(130,130,4);
  let s='';
  if(!nr)s+='<g'+(o.rid?' id="'+o.rid+'"':'')+' style="transform-origin:130px 130px;transform:rotate('+(o.rot||0)+'deg)">'+roseInner()+'</g>';
  (o.legs||[]).forEach(l=>{const L=l.len||(nr?112:120),q=PB(RC,l.b,L);add(q[0],q[1],4);s+='<line x1="130" y1="130" x2="'+f1(q[0])+'" y2="'+f1(q[1])+'" stroke="'+(l.col||'#2a6fdb')+'" stroke-width="'+(l.w||4)+'" stroke-linecap="round"/>'});
  const AR=(a,r,col,w)=>{[a[0],a[1],a[0]+N360(a[1]-a[0])/2].forEach(b=>{const p=PB(RC,b,r);add(p[0],p[1],3)});return '<path d="'+arcD(a[0],a[1],r)+'" fill="none" stroke="'+(col||'#d6336c')+'" stroke-width="'+(w||3)+'"/>'};
  if(o.arc){if(o.right){[o.arc[0],o.arc[1]].forEach(b=>{const p=PB(RC,b,22);add(p[0],p[1],3)});s+='<path d="'+sqD(o.arc[0],o.arc[1],22)+'" fill="none" stroke="#d6336c" stroke-width="3" stroke-linejoin="round"/>'}else s+=AR(o.arc,nr?30:20)}
  (o.arcs||[]).forEach(a=>{s+=AR(a.a,a.r,a.col,a.w)});
  (o.ends||[]).forEach(e=>{const p=PB(RC,e.b,nr?126:126);add(p[0],p[1],10);s+='<text class="bub" text-anchor="middle" dominant-baseline="middle" x="'+f1(p[0])+'" y="'+f1(p[1])+'" style="fill:#17324d">'+e.t+'</text>'});
  (o.hl||[]).forEach(h=>{const p=PB(RC,h.b,RR-4),q=PB(RC,h.b,RR+16);add(q[0],q[1],14);s+='<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="6" fill="#ffc533" stroke="#b35f00" stroke-width="2"/><text class="bub" text-anchor="middle" dominant-baseline="middle" x="'+f1(q[0])+'" y="'+f1(q[1])+'">'+h.t+'</text>'});
  if(o.name){const bis=(o.arc?o.arc[0]+N360(o.arc[1]-o.arc[0])/2:0)+180,p=PB(RC,bis,nr?22:34);add(p[0],p[1],8);s+='<text class="lt" text-anchor="middle" dominant-baseline="middle" x="'+f1(p[0])+'" y="'+f1(p[1])+'">'+o.name+'</text>'}
  s+='<circle cx="130" cy="130" r="4.5" fill="#d6336c" stroke="#fff" stroke-width="1.5"/>';
  let vb;
  if(!nr||o.full){vb='-10 -10 280 280'}
  else{x0-=14;y0-=14;x1+=14;y1+=14;let w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;w=Math.max(w,150);h=Math.max(h,110);if(w/h>2)h=w/2;if(h/w>1.25)w=h/1.25;vb=f1(cx-w/2)+' '+f1(cy-h/2)+' '+f1(w)+' '+f1(h)}
  return '<svg class="fig'+(o.dr?' dr':'')+'"'+(o.id?' id="'+o.id+'"':'')+' viewBox="'+vb+'" style="max-width:'+(o.max||300)+'px;max-height:'+(nr?230:320)+'px" role="img" aria-label="'+(o.aria||'Kompasroos met een hoek')+'">'+s+'</svg>'}
const FIGC=svg=>'<div class="center">'+svg+'</div>';
/* aflezen: 0°-lijn (grijs) en blauwe lijn */
const FIGREAD=X=>FIGC(roseSvg({legs:[{b:0,col:'#8aa3bd',w:3},{b:X}],hl:[{b:X,t:'?'}],aria:'Kompasroos. De blauwe lijn wijst naar een getal.'}));
/* meten: roos met 0° op het eerste been */

const mascot=()=>'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#ffc533" stroke="#c98f00" stroke-width="4"/><path d="M28 72 L28 30 L72 72 Z" fill="#fff" stroke="#17324d" stroke-width="4" stroke-linejoin="round"/><path d="M28 60 L40 60 L40 72" fill="none" stroke="#d6336c" stroke-width="3.5"/></svg>';
function totalPts(){return Object.values(DB.lv).reduce((a,v)=>a+(v.pts||0),0)}
function topbar(show){$('#bar').hidden=!show;if(!show)return;$('#av').innerHTML=mascot();$('#nm').textContent=DB.name;$('#pt').textContent=S.mode==='quiz'?('Punten: '+S.pts+' van 10'):(totalPts()+' van '+NQ+' punten');$('#ts').textContent=DB.sound?'\u{1F3B5} Geluid aan':'\u{1F515} Geluid uit'}
function renderVP(){const box=$('#vp');loadVoices();const cur=bestVoice();let h='<h2>Kies een stem</h2>';
  if(!VOICES.length)h+='<div class="say">Op dit apparaat is geen Nederlandse stem gevonden. Daarom wordt er niet voorgelezen. Installeer een Nederlandse stem in de instellingen van je apparaat (bij Spraak), of gebruik Microsoft Edge of Google Chrome.</div>';
  else{h+='<p class="note">Tik op een stem om hem te horen. De stem die je kiest blijft bewaard.</p><div class="opts">'+VOICES.slice().sort((a,b)=>vScore(b)-vScore(a)).map((v,i)=>'<button class="opt'+(cur&&cur.name===v.name?' ok':'')+'" type="button" data-vn="'+esc(v.name)+'">'+esc(v.name)+' ('+esc(v.lang)+')'+(i===0?' · aanbevolen':'')+'</button>').join('')+'</div><p><b>Snelheid</b></p><div class="chips">'+[['Langzaam',.75],['Normaal',.9],['Snel',1.05]].map(x=>'<button type="button" class="c2'+((DB.rate||.9)===x[1]?' sel':'')+'" data-rt="'+x[1]+'">'+x[0]+'</button>').join('')+'</div>'}
  h+='<div class="row"><button class="btn alt small" id="vc" type="button">Sluiten</button></div>';box.innerHTML=h;
  $$('[data-vn]',box).forEach(b=>b.onclick=()=>{DB.voiceName=b.dataset.vn;save();speak('Hallo '+DB.name+'. Een hoek meet je met de kompasroos.');renderVP()});
  $$('[data-rt]',box).forEach(b=>b.onclick=()=>{DB.rate=+b.dataset.rt;save();speak('Dit is de snelheid die je kiest.');renderVP()});
  $('#vc').onclick=()=>{box.hidden=true}}
$('#tp').onclick=()=>{const v=$('#vp');v.hidden=!v.hidden;if(!v.hidden)renderVP()};
$('#ts').onclick=()=>{DB.sound=!DB.sound;save();topbar(true)};
function setProg(p){const g=$('#pg');g.hidden=p==null;if(p!=null)$('i',g).style.width=p+'%'}
const fmtT=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+' min';
const starsOf=p=>p>=9?3:p>=7?2:p>=5?1:0;
const starTxt=n=>'★'.repeat(n)+'☆'.repeat(3-n);

/* ---------- onderkant: Menu, Vorige, Volgende ---------- */
function navHtml(){return '<div class="nav"><button class="btn alt" id="bMenu" type="button">Menu</button><button class="btn alt" id="bPrev" type="button">← Vorige</button><button class="btn" id="bMain" type="button">Volgende →</button></div>'}
function setMain(label,fn,off,good){const x=$('#bMain');x.textContent=label;x.disabled=!!off;x.className='btn'+(good?' good':'');x.onclick=off?null:fn}
function wireNav(prev,ask){const m=$('#bMenu'),p=$('#bPrev');p.disabled=!prev;p.onclick=prev?()=>{sfx('tap');prev()}:null;
  m.onclick=()=>{if(ask&&ask()&&!m.dataset.arm){m.dataset.arm='1';m.textContent='Zeker weten?';setTimeout(()=>{if(m.isConnected){delete m.dataset.arm;m.textContent='Menu'}},3500);return}menu()}}
const askMenu=()=>S.mode==='quiz'&&S.log.length>0&&!S.fin;
function leaveQ(){if(S.mode==='quiz'&&S.locked&&S.snap&&$('#ans')){S.snap[S.i]=stage.innerHTML}}
function qNext(){leaveQ();S.i<S.qs.length-1?(S.i++,showQ()):finish()}
function qPrev(){leaveQ();if(S.i>0){S.i--;showQ()}else explain(S.lv,LV[S.lv].steps.length-1)}
/* ---------- schermen ---------- */
function nameScreen(){topbar(false);setProg(null);
  stage.innerHTML='<div class="card"><h1>5.4 Hoeken meten</h1><p>In deze les leer je hoe je een hoek meet met de kompasroos. Je speelt met knoppen en maakt 50 vragen. Daarna leer je stap voor stap hoe je de opdrachten uit je boek maakt.</p><label for="nmi"><b>Schrijf hier je naam</b></label><div class="row"><input class="nm" id="nmi" maxlength="30" autocomplete="off"></div><div class="row"><button class="btn" id="go" type="button">Beginnen</button></div><p class="note" id="er" hidden>Schrijf eerst je naam.</p></div>';
  const go=()=>{const v=$('#nmi').value.trim();if(v.length<2){$('#er').hidden=false;return}DB.name=v;save();menu()};
  $('#go').onclick=go;$('#nmi').onkeydown=e=>{if(e.key==='Enter')go()}}
function menu(){S.lv=null;S.mode='';S.keep=false;S.fin=false;stopSpeech();topbar(true);setProg(null);window.scrollTo(0,0);
  const done=LV.every((_,i)=>DB.lv[i]&&DB.lv[i].done);
  let h='<div class="card"><h1>Hoi '+esc(DB.name)+'!</h1><p>Kies een onderdeel. Je begint met de uitleg en daarna maak je 10 vragen.</p>'+(done?'<div class="fb ok">Je hebt alle onderdelen gedaan! Totaal: '+totalPts()+' van '+NQ+' punten.</div>':'')+'<div class="lv">';
  LV.forEach((l,i)=>{const r=DB.lv[i];h+='<button class="lvb'+(r&&r.done?' done':'')+'" data-i="'+i+'" type="button"><span class="lvn">'+(i+1)+'</span><span><b>'+l.t+'</b><small>'+l.sub+(r&&r.done?' · '+r.pts+' van 10'+(r.time?' · '+fmtT(r.time):''):'')+'</small></span><span class="st">'+(r&&r.done?starTxt(starsOf(r.pts)):'')+'</span></button>'});
  const nb=Object.keys(DB.book).length;
  h+='<button class="lvb bk" id="bk" type="button"><span class="lvn">\u{1F4D6}</span><span><b>Extra: opdrachten uit je boek</b><small>Stap voor stap uitleg bij elke opdracht van 5.4 · '+nb+' van '+BOOK.length+' bekeken</small></span></button></div>';
  h+='<div class="row"><button class="btn alt small" id="rs" type="button">Opnieuw beginnen</button><span class="note" id="rsn"></span></div></div>';
  stage.innerHTML=h;$$('.lvb[data-i]').forEach(b=>b.onclick=()=>explain(+b.dataset.i,0));$('#bk').onclick=bookMenu;
  let armed=0;$('#rs').onclick=function(){if(!armed){armed=1;$('#rsn').textContent='Zeker weten? Tik nog een keer. Je punten en je naam worden gewist.';setTimeout(()=>{armed=0;$('#rsn').textContent=''},4000)}else{DB={name:'',lv:{},book:{},voice:DB.voice,sound:DB.sound,rate:DB.rate,voiceName:DB.voiceName};save();nameScreen()}}}
function explain(i,k){S.lv=i;S.mode='';stopSpeech();topbar(true);setProg(null);const L=LV[i],st=L.steps[k];
  const paras=st.txt.split('\n').map(p=>'<div class="say">'+p+'</div>').join('');
  stage.innerHTML='<div class="card"><div class="qhead"><span>Uitleg · onderdeel '+(i+1)+': '+L.t+'</span><span>'+(k+1)+' van '+L.steps.length+'</span></div><h2>'+st.h+'</h2>'+paras+(st.fig?'<div>'+st.fig()+'</div>':'')+(st.w?'<div class="wd" id="wd"></div>':'')+'<div class="row"><span id="lis"></span></div>'+navHtml()+'</div>';
  if(st.w)WID[st.w]($('#wd'),st.o);
  $('#lis').appendChild(listenBtn(say(st.h+'. '+st.txt.replace(/\n/g,' '))));
  wireNav(k?()=>explain(i,k-1):null,null);
  setMain('Volgende →',()=>{if(k<L.steps.length-1)explain(i,k+1);else if(S.keep&&S.lv===i&&!S.fin){showQ()}else startQuiz(i)});
  window.scrollTo(0,0)}
/* ----- vragen ----- */
function startQuiz(i){S={lv:i,i:0,tries:0,pts:0,qs:LV[i].gen(),locked:false,log:[],mode:'quiz',t0:0,seq:[],snap:[],keep:true,saved:false,fin:false};showQ()}
function progress(){const L=S.qs.length;let h='';for(let i=0;i<L;i++){h+='<i style="display:inline-block;width:20px;height:20px;margin:0 2px;border-radius:50%;border:3px solid '+(i<S.log.length?(S.log[i].pts?'#4aa83a':'#e8883a'):(i===S.i?'#2a6fdb':'#c4dcf2'))+';background:'+(i<S.log.length?(S.log[i].pts?'#7ed36a':'#ffb066'):'#fff')+'"></i>'}return '<div class="center" style="margin:4px 0 10px">'+h+'</div>'}
function showQ(){stopSpeech();window.scrollTo(0,0);S.mode='quiz';S.fin=false;topbar(true);const L=LV[S.lv],q=S.qs[S.i],n=S.qs.length;setProg(S.i/n*100);
  const lastLab=S.i===n-1?'Klaar ▶':'Volgende →';
  if(S.snap[S.i]){stage.innerHTML=S.snap[S.i];S.locked=true;$('#lis').innerHTML='';$('#lis').appendChild(listenBtn(q.say||say(q.text)));wireNav(qPrev,askMenu);setMain(lastLab,qNext,false,true);return}
  S.t0=Date.now();S.tries=0;S.locked=false;S.seq=[];
  let h='<div class="card"><div class="qhead"><span>'+L.t+'</span><span>Vraag '+(S.i+1)+' van '+n+'</span></div>'+progress();
  if(q.fig)h+=q.fig;
  h+='<div class="q">'+q.text+'</div><div id="ans">';
  if(q.type==='mc')h+='<div class="opts'+(q.two?' two':'')+'">'+q.opts.map(o=>'<button class="opt" type="button" data-v="'+esc(o.v)+'">'+o.h+'</button>').join('')+'</div>';
  else if(q.type==='order'){const cs=shuffle(q.cards.map((c,i)=>i));h+='<div class="opts" id="ord">'+cs.map(i=>'<button class="opt" type="button" data-v="'+i+'">'+q.cards[i].h+'<span class="nb" hidden></span></button>').join('')+'</div>'}
  h+='</div><div id="fbk" role="status" aria-live="polite"></div><div class="row"><span id="lis"></span></div>'+navHtml()+'</div>';
  stage.innerHTML=h;$('#lis').appendChild(listenBtn(q.say||say(q.text)));
  wireNav(qPrev,askMenu);setMain(lastLab,qNext,true);
  if(q.type==='mc')$$('.opt').forEach(b=>b.onclick=()=>judge(b.dataset.v===q.ans,b));
  else if(q.type==='order')$$('#ord > button').forEach(b=>b.onclick=()=>{if(S.locked||S.seq.includes(+b.dataset.v))return;sfx('tap');S.seq.push(+b.dataset.v);const nb=$('.nb',b);nb.hidden=false;nb.textContent=S.seq.length;b.classList.add('sel');
    if(S.seq.length===q.cards.length){const ok=S.seq.every((v,i)=>q.cards[v].r===i);if(ok)judge(true);else{judge(false,null,'Nog niet goed. De volgorde klopt niet. Begin opnieuw.');if(!S.locked){S.seq=[];$$('#ord > button').forEach(x=>{x.classList.remove('sel');$('.nb',x).hidden=true})}}}})}
function fb(k,t){$('#fbk').innerHTML='<div class="fb '+k+'">'+t+'</div>'}
function judge(ok,btn,msg){if(S.locked)return;const q=S.qs[S.i];
  if(ok){S.locked=true;sfx('ok');const aw=S.tries===0?1:0,sec=Math.round((Date.now()-S.t0)/1000);S.pts+=aw;S.log.push({pts:aw,sec});topbar(true);if(btn)btn.classList.add('ok');fb('ok',pick(['Goed zo!','Super!','Knap gedaan!','Helemaal goed!'])+' '+(aw?'+1 punt':'Geen punt, want het was niet de eerste keer goed.')+' · '+sec+' sec');endQ()}
  else{S.tries++;sfx('no');if(btn){btn.classList.add('no');btn.disabled=true}
    if(S.tries===1)fb('no',msg||'Nog niet goed. Probeer het nog een keer.');
    else if(S.tries===2)$('#fbk').innerHTML='<div class="fb no">'+(msg||'Nog niet goed.')+'</div><div class="fb tip">'+q.tip+'</div>';
    else{S.locked=true;const sec=Math.round((Date.now()-S.t0)/1000);S.log.push({pts:0,sec});
      if(q.type==='mc')$$('.opt').forEach(b=>{if(b.dataset.v===q.ans)b.classList.add('ok')});
      if(q.type==='order'){const o=q.cards.map((c,i)=>i).sort((a,b)=>q.cards[a].r-q.cards[b].r);$$('#ord > button').forEach(b=>{const nb=$('.nb',b);nb.hidden=false;nb.textContent=o.indexOf(+b.dataset.v)+1})}
      $('#fbk').innerHTML='<div class="fb no">Het goede antwoord is: '+q.show+' · 0 punten · '+sec+' sec</div><div class="fb tip">'+q.tip+'</div>';endQ()}}}
function endQ(){$$('.opt').forEach(b=>b.disabled=true);setMain(S.i===S.qs.length-1?'Klaar ▶':'Volgende →',qNext,false,true);$('#bMain').focus()}
function finish(){setProg(100);window.scrollTo(0,0);const i=S.lv,p=S.pts,n=S.qs.length,old=DB.lv[i]||{};
  const tot=S.log.reduce((a,x)=>a+x.sec,0);
  if(!S.saved){S.saved=true;DB.lv[i]={done:true,pts:Math.max(old.pts||0,p),last:p,time:tot,n:(old.n||0)+1};save()}
  S.mode='';S.fin=true;topbar(true);sfx('win');
  const all=LV.every((_,j)=>DB.lv[j]&&DB.lv[j].done),s=starsOf(p),r=p/n;
  let h='<div class="card center"><h1>Onderdeel '+(i+1)+' klaar!</h1><div class="stars">'+starTxt(s)+'</div><p class="big">'+p+' van '+n+' meteen goed</p><p>Tijd: '+fmtT(tot)+' · gemiddeld '+Math.round(tot/Math.max(1,S.log.length))+' sec per vraag</p><details style="text-align:left"><summary>Bekijk elke vraag</summary><table class="lg"><tr><th>Vraag</th><th>Punten</th><th>Tijd</th></tr>'+S.log.map((x,j)=>'<tr><td>'+(j+1)+'</td><td>'+x.pts+'</td><td>'+x.sec+' sec</td></tr>').join('')+'</table></details><p>'+(r>=.9?'Fantastisch!':r>=.7?'Heel goed gedaan!':r>=.5?'Goed bezig. Oefen nog een keer voor meer sterren.':'Blijf oefenen, dan wordt het steeds makkelijker.')+'</p>';
  if(all)h+='<div class="fb ok">Je hebt alle '+LV.length+' onderdelen gedaan! Totaal: '+totalPts()+' van '+NQ+' punten.</div>';
  h+='<div class="row" style="justify-content:center"><button class="btn alt" id="ag" type="button">Nog een keer</button></div>'+navHtml()+'</div>';
  stage.innerHTML=h;$('#ag').onclick=()=>startQuiz(i);
  wireNav(()=>{S.i=n-1;showQ()},null);
  if(i<LV.length-1)setMain('Volgende →',()=>explain(i+1,0));else setMain('Naar het boek ▶',bookMenu)}
/* ----- opdrachten uit het boek ----- */
function bookMenu(){S.mode='';S.keep=false;S.fin=false;stopSpeech();topbar(true);setProg(null);window.scrollTo(0,0);
  const pages=[...new Set(BOOK.map(b=>b.page))];
  let h='<div class="card"><h1>Opdrachten uit je boek</h1><div class="where">Pak je boek. Zoek <b>'+PAD+'</b>. Kies hieronder de opdracht waar je mee bezig bent. Je krijgt kleine stappen: wat moet je doen?</div>';
  pages.forEach(pg=>{h+='<h3>Bladzijde '+pg+'</h3><div class="lv">'+BOOK.filter(b=>b.page===pg).map(b=>'<button class="lvb bk" data-id="'+b.id+'" type="button"><span class="lvn" style="font-size:.95rem">'+b.nr+'</span><span><b>Opdracht '+b.nr+'</b><small>'+b.title+'</small></span><span class="st">'+(DB.book[b.id]?'✓':'')+'</span></button>').join('')+'</div>'});
  h+=navHtml()+'</div>';
  stage.innerHTML=h;$$('.lvb[data-id]').forEach(b=>b.onclick=()=>bookEx(b.dataset.id));
  wireNav(null,null);setMain('Eerste opdracht →',()=>bookEx(BOOK[0].id))}
function bookEx(id){stopSpeech();topbar(true);setProg(null);S.mode='';const B=BOOK.find(x=>x.id===id),ix=BOOK.indexOf(B);let qi=0,good=0;const R=[];
  const IMG='<a href="boek/p'+B.page+'-opdracht-'+B.nr+'.png" target="_blank" rel="noopener"><img class="bk" src="boek/p'+B.page+'-opdracht-'+B.nr+'.png" alt="Opdracht '+B.nr+' uit je boek, bladzijde '+B.page+'"></a><p class="note center" style="margin:0">Tik op de afbeelding om groter te zien.</p>';
  stage.innerHTML='<div class="card"><div class="badges"><span class="badge">Bladzijde '+B.page+'</span><span class="badge o">Opdracht '+B.nr+'</span></div><p class="note" style="margin-top:0">'+PAD+'</p><h2>'+B.title+'</h2>'
   +'<div class="where">Pak je boek. Sla open <b>bladzijde '+B.page+'</b> en zoek <b>opdracht '+B.nr+'</b>.</div>'
   +'<h3>Waar gaat het over?</h3><div class="say">'+B.about+'</div>'
   +'<h3>De opdracht uit je boek</h3>'+IMG+'<p class="note center">Zo staat de opdracht in je boek. Het antwoord staat er niet bij.</p>'
   +'<h3>Wat moet je doen? Stap voor stap</h3>'+B.steps.map((t,i)=>'<div class="stp"><span class="n">'+(i+1)+'</span><span>'+t+'</span></div>').join('')
   +'<div class="row"><span id="lis"></span></div>'
   +(B.w?'<h3>Probeer het hier met de kompasroos</h3>'+B.w.map((w,i)=>'<div class="wd" id="bw'+i+'"></div>').join(''):'')
   +'<h3>Nu jij</h3><div id="qz"></div>'+navHtml()+'</div>';
  $('#lis').appendChild(listenBtn(say(B.title+'. '+B.about+' Wat moet je doen? '+B.steps.join(' '))));
  if(B.w)B.w.forEach((w,i)=>WID[w.t]($('#bw'+i),w));
  const qz=$('#qz');
  function nextOpdr(){ix<BOOK.length-1?bookEx(BOOK[ix+1].id):menu()}
  function prevOpdr(){ix>0?bookEx(BOOK[ix-1].id):bookMenu()}
  function nav(){const last=qi>=B.qs.length;
    wireNav(()=>{if(qi>0){qi--;showQ()}else prevOpdr()},null);
    if(last)setMain(ix<BOOK.length-1?'Volgende opdracht →':'Naar het menu ▶',nextOpdr,false,true);
    else setMain('Volgende vraag →',()=>{qi++;qi<B.qs.length?showQ():done()},!R[qi],true)}
  function showQ(){const q=B.qs[qi],r=R[qi];
    qz.innerHTML='<div class="qhead"><span>Opdracht '+B.nr+' · vraag '+q.lab+'</span><span>Stap '+(qi+1)+' van '+B.qs.length+'</span></div>'+(q.fig?'<div>'+q.fig()+'</div>':'')+'<div class="q">'+q.text+'</div><div class="opts" id="bo">'+(r?r.order:shuffle(q.opts.map((o,i)=>i))).map(i=>'<button class="opt" type="button" data-i="'+i+'" data-ok="'+(q.opts[i].ok?1:0)+'">'+q.opts[i].t+'</button>').join('')+'</div><div id="bf"></div><div class="row"><span id="bl2"></span></div>';
    $('#bl2').appendChild(listenBtn(say(q.text)));
    const order=$$('#bo .opt').map(x=>+x.dataset.i);
    const show=(b,ok)=>{$$('#bo .opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('ok')});if(!ok)b.classList.add('no');
      const right=q.opts.filter(o=>o.ok).map(o=>o.t).join(', ');
      $('#bf').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Goed zo!':'Niet goed. Het goede antwoord is: '+right)+'</div><div class="ans"><b>Waarom?</b> '+q.why+'</div>'};
    if(r){show($('#bo .opt[data-i="'+r.i+'"]'),r.ok)}
    else $$('#bo .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1';sfx(ok?'ok':'no');if(ok)good++;R[qi]={i:+b.dataset.i,ok,order};show(b,ok);nav();$('#bMain').focus()});
    nav()}
  function done(){DB.book[B.id]=1;save();sfx('win');qz.innerHTML='<div class="fb ok">Opdracht '+B.nr+' klaar! Je had '+good+' van '+B.qs.length+' meteen goed.</div><p>Maak nu de opdracht ook in je boek. Je weet hoe je het moet aanpakken.</p>';nav();window.scrollTo({top:$('#qz').offsetTop-200,behavior:'smooth'})}
  showQ();window.scrollTo(0,0)}
window.BR={S:()=>S,LV,BOOK,M,WID};
if(DB.name)menu();else nameScreen();

</script></body></html>
