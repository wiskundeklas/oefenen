<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='wiskunde-kompasroos-v1';
let DB={name:'',lv:{},book:{},voice:true,sound:true};
try{const r=localStorage.getItem(KEY);if(r)DB=Object.assign(DB,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- geluid en stem ---------- */
let AC=null;
function tone(f,t,d,type,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.setValueAtTime(0.0001,AC.currentTime+t);v.gain.exponentialRampToValueAtTime(g||.12,AC.currentTime+t+.02);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+d);o.connect(v);v.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}catch(e){}}
function sfx(k){if(!DB.sound)return;
  if(k==='ok'){[523,659,784].forEach((f,i)=>tone(f,i*.1,.25))}
  else if(k==='no'){tone(300,0,.18,'triangle',.08);tone(260,.14,.22,'triangle',.08)}
  else if(k==='tap')tone(620,0,.07,'sine',.07);
  else if(k==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.3))}}
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^nl([-_]|$)/i.test(v.lang))}catch(e){VOICES=[]}}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function vScore(v){let n=0;if(/nl[-_]NL/i.test(v.lang))n+=3;if(/natural|online|neural|premium|enhanced|siri/i.test(v.name))n+=5;if(/colette|fenna|claire|ellen|google nederlands|female|vrouw|dena/i.test(v.name))n+=3;if(/maarten|xander|frank|ruben|arnaud/i.test(v.name))n-=2;if(v.localService)n+=1;return n}
function bestVoice(){loadVoices();if(!VOICES.length)return null;if(DB.voiceName){const m=VOICES.find(v=>v.name===DB.voiceName);if(m)return m}return VOICES.slice().sort((a,b)=>vScore(b)-vScore(a))[0]}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
let vmT=0;
function noVoiceMsg(){const m=$('#vmsg');m.textContent='Op dit apparaat is geen Nederlandse stem gevonden. Daarom lees ik niet voor. Installeer een Nederlandse stem in de instellingen van je apparaat (bij Spraak), of gebruik Microsoft Edge of Google Chrome.';m.hidden=false;clearTimeout(vmT);vmT=setTimeout(()=>{m.hidden=true},9000)}
function speak(t){if(!t)return;try{const v=bestVoice();if(!v){noVoiceMsg();return}stopSpeech();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=DB.rate||.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function listenBtn(t){const b=document.createElement('button');b.type='button';b.className='btn alt small';b.textContent='\u{1F50A} Lees voor';b.onclick=()=>speak(t);return b}
const say=s=>String(s).replace(/<[^>]+>/g,' ').replace(/∠/g,'hoek ').replace(/[∟┐]/g,'hoekje').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
/* ---------- meetkunde ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const dir=a=>[Math.cos(rad(a)),-Math.sin(rad(a))];
const PT=(V,a,r)=>{const d=dir(a);return [V[0]+r*d[0],V[1]+r*d[1]]};
const f1=n=>(+n).toFixed(1),pp=p=>f1(p[0])+','+f1(p[1]);
const cls=d=>Math.abs(d-90)<1?'recht':d<90?'scherp':'stomp';
const NAME={recht:'recht',scherp:'scherp',stomp:'stomp'},ADJ={recht:'rechte',scherp:'scherpe',stomp:'stompe'};
function rndDeg(c){return c==='recht'?90:c==='scherp'?ri(20,72):ri(108,160)}
const rndRot=()=>ri(0,35)*10;
function arcPath(V,a,b,r){let d=((b-a)%360+360)%360;if(d>180){const t=a;a=b;b=t;d=360-d}return 'M'+pp(PT(V,a,r))+' A'+r+' '+r+' 0 0 0 '+pp(PT(V,a+d,r))}
function sqPath(V,a,b,s){const p1=PT(V,a,s),p3=PT(V,b,s),p2=[p1[0]+p3[0]-V[0],p1[1]+p3[1]-V[1]];return 'M'+pp(p1)+' L'+pp(p2)+' L'+pp(p3)}
function angleSvg(d,rot,o){o=o||{};const V=[80,76],L=58,a1=rot,a2=rot+d;let s='';
  if(o.geo){const g=[V,PT(V,a1,74),PT(V,a1+90,74)];s+='<polygon class="geo" points="'+g.map(pp).join(' ')+'"/><path class="sgn" style="stroke:#b88600" d="'+sqPath(V,a1,a1+90,12)+'"/>'}
  s+='<line class="ray" x1="'+f1(V[0])+'" y1="'+f1(V[1])+'" x2="'+pp(PT(V,a1,L)).replace(',','" y2="')+'"/><line class="ray2" x1="'+f1(V[0])+'" y1="'+f1(V[1])+'" x2="'+pp(PT(V,a2,L)).replace(',','" y2="')+'"/>';
  if(o.sq)s+='<path class="sgn" d="'+sqPath(V,a1,a2,15)+'"/>';else if(o.arc!==false)s+='<path class="arc" d="'+arcPath(V,a1,a2,20)+'"/>';
  s+='<circle class="vd" cx="'+V[0]+'" cy="'+V[1]+'" r="4.5"/>';
  return '<svg class="fig ang" viewBox="0 0 160 152" role="img" aria-label="Een hoek">'+s+'</svg>'}
/* figuren */
const LIB={
 'scherpe driehoek':[[20,150],[180,150],[110,25]],
 'stompe driehoek':[[20,150],[180,150],[100,90]],
 'rechthoekige driehoek':[[30,160],[170,160],[30,40]],
 'rechthoek':[[30,50],[170,50],[170,150],[30,150]],
 'parallellogram':[[50,50],[190,50],[150,150],[10,150]],
 'trapezium':[[20,150],[180,150],[130,50],[20,50]],
 'huisje':[[40,150],[160,150],[160,90],[100,10],[40,90]],
 'zeshoek':[[100,30],[160.6,65],[160.6,135],[100,170],[39.4,135],[39.4,65]],
 'vijfhoek':[[100,20],[176,75.2],[147,164.7],[53,164.7],[24,75.2]]
};
function polyData(name,rot){const base=LIB[name]||EXTRA[name],c=[100,100],r=rad(-rot);
  const pts=base.map(p=>{const x=p[0]-c[0],y=p[1]-c[1];return [c[0]+x*Math.cos(r)-y*Math.sin(r),c[1]+x*Math.sin(r)+y*Math.cos(r)]});
  const n=pts.length,info=pts.map((p,i)=>{const a=pts[(i+n-1)%n],b=pts[(i+1)%n],va=[a[0]-p[0],-(a[1]-p[1])],vb=[b[0]-p[0],-(b[1]-p[1])];
    const A=deg(Math.atan2(va[1],va[0])),B=deg(Math.atan2(vb[1],vb[0]));let d=Math.abs(A-B);if(d>180)d=360-d;return{p,a:A,b:B,d,c:cls(d)}});
  return{name,pts,info}}
const LET='ABCDEF';
function polySvg(name,rot,o){o=o||{};const D=polyData(name,rot),cen=[D.pts.reduce((s,p)=>s+p[0],0)/D.pts.length,D.pts.reduce((s,p)=>s+p[1],0)/D.pts.length];let s='<polygon class="pg" points="'+D.pts.map(pp).join(' ')+'"/>';
  D.info.forEach((v,i)=>{if(o.mark===i)s+='<path class="arc" d="'+arcPath(v.p,v.a,v.b,18)+'"/>';if(o.sqs&&o.sqs.includes(i)&&v.c==='recht')s+='<path class="sgn" d="'+sqPath(v.p,v.a,v.b,13)+'"/>';
    if(o.labels!==false){const dx=v.p[0]-cen[0],dy=v.p[1]-cen[1],l=Math.hypot(dx,dy)||1;s+='<text class="lt" text-anchor="middle" dominant-baseline="middle" x="'+f1(v.p[0]+dx/l*14)+'" y="'+f1(v.p[1]+dy/l*14)+'">'+LET[i]+'</text>'}
    if(o.tap)s+='<circle class="vtx'+(o.sel===i?' sel':'')+'" data-v="'+i+'" cx="'+f1(v.p[0])+'" cy="'+f1(v.p[1])+'" r="9"/>'});
  return {svg:'<svg class="fig poly" viewBox="-10 -10 220 220" role="img" aria-label="Figuur '+esc(name)+'">'+s+'</svg>',D}}
function signSvg(k){const legs='<path d="M12 50 L52 50 M12 50 L12 10" stroke="#17324d" stroke-width="4" stroke-linecap="round" fill="none"/>';
  const m={sq:'<path d="M12 38 L24 38 L24 50" fill="none" stroke="#d6336c" stroke-width="3.5" stroke-linejoin="round"/>',arc:'<path d="M12 32 A18 18 0 0 1 30 50" fill="none" stroke="#e8870a" stroke-width="3.5"/>',cross:'<path d="M17 36 L27 46 M27 36 L17 46" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>',dot:'<circle cx="24" cy="38" r="4" fill="#2a6fdb"/><circle cx="32" cy="38" r="4" fill="#2a6fdb"/>'};
  return '<svg viewBox="0 0 64 60" aria-hidden="true">'+legs+m[k]+'</svg>'}
/* ---------- vragen ---------- */
const O=(v,h)=>({v,h});
const O3=()=>[O('recht','Recht'),O('scherp','Scherp'),O('stomp','Stomp')];
const LET4='ABCD';
function build(plan,make){const seen=new Set(),out=[];let t=0;plan=shuffle(plan);
  while(out.length<plan.length&&t<800){t++;const q=make(plan[out.length]);if(!q||seen.has(q.key))continue;seen.add(q.key);out.push(q)}
  return out}
function cardsQ(ds,rots){return ds.map((d,i)=>({d,rot:rots?rots[i]:rndRot()}))}
function distinctDegs(n,gap,lo,hi){for(let t=0;t<200;t++){const a=[];while(a.length<n)a.push(ri(lo,hi));const s=a.slice().sort((x,y)=>x-y);let ok=true;for(let i=1;i<n;i++)if(s[i]-s[i-1]<gap)ok=false;if(ok)return a}return [30,70,120,150].slice(0,n)}
const TF={
 1:[['Een rechte hoek past precies in de hoek van een vel papier.',1],['In een rechte hoek zet je een klein hoekje als teken.',1],['Loodrechte lijnen maken samen een rechte hoek.',1],['Een rechte hoek is kleiner dan een scherpe hoek.',0],['Als de benen van een hoek langer zijn, is de hoek groter.',0],['Het teken voor een rechte hoek is een boogje.',0]],
 2:[['Past het andere been precies langs de rand van de geodriehoek? Dan is de hoek recht.',1],['Steekt het andere been buiten de geodriehoek uit? Dan is de hoek stomp.',1],['Zit het andere been binnen de geodriehoek? Dan is de hoek scherp.',1],['Zit het andere been binnen de geodriehoek? Dan is de hoek stomp.',0],['Een geodriehoek heeft een rechte hoek.',1],['Je legt de geodriehoek ergens naast de hoek.',0]],
 3:[['Een stompe hoek is groter dan een rechte hoek.',1],['Een scherpe hoek is kleiner dan een rechte hoek.',1],['Een scherpe hoek is groter dan een rechte hoek.',0],['Een rechte hoek is een stompe hoek.',0],['Een stompe hoek is kleiner dan een rechte hoek.',0],['Hoe langer de benen, hoe stomper de hoek.',0]]};
function mkTF(g){const [t,ok]=pick(TF[g]);return{key:'tf'+g+t,type:'mc',text:t,say:t,opts:[O('w','Waar'),O('n','Niet waar')],ans:ok?'w':'n',tip:'Tip: denk aan de rechte hoek van een vel papier of een geodriehoek.',show:ok?'Waar':'Niet waar',two:true}}

  const tot=S.log.reduce((a,x)=>a+x.sec,0);S.mode='';DB.lv[i]={done:true,pts:Math.max(old.pts||0,p),last:p,time:tot,n:(old.n||0)+1};save();topbar(true);sfx('win');
  const all=LV.every((_,j)=>DB.lv[j]&&DB.lv[j].done),s=starsOf(p);
  let h='<div class="card center"><h1>Onderdeel '+(i+1)+' klaar!</h1><div class="stars">'+starTxt(s)+'</div><p class="big">'+p+' van 10 meteen goed</p><p>Tijd: '+fmtT(tot)+' · gemiddeld '+Math.round(tot/Math.max(1,S.log.length))+' sec per vraag</p><details style="text-align:left"><summary>Bekijk elke vraag</summary><table class="lg"><tr><th>Vraag</th><th>Punten</th><th>Tijd</th></tr>'+S.log.map((x,j)=>'<tr><td>'+(j+1)+'</td><td>'+x.pts+'</td><td>'+x.sec+' sec</td></tr>').join('')+'</table></details><p>'+(p>=9?'Fantastisch!':p>=7?'Heel goed gedaan!':p>=5?'Goed bezig. Oefen nog een keer voor meer sterren.':'Blijf oefenen, dan wordt het steeds makkelijker.')+'</p>';
  if(all)h+='<div class="fb ok">Je hebt alle onderdelen gedaan! Totaal: '+totalPts()+' van 60 punten.</div>';
  h+='<div class="row" style="justify-content:center"><button class="btn alt" id="ag" type="button">Nog een keer</button>'+(i<LV.length-1?'<button class="btn" id="nl" type="button">Volgend onderdeel ▶</button>':'<button class="btn" id="tb" type="button">Naar het boek ▶</button>')+'<button class="btn alt" id="mn" type="button">Menu</button></div></div>';
  stage.innerHTML=h;$('#ag').onclick=()=>startQuiz(i);$('#mn').onclick=menu;if($('#nl'))$('#nl').onclick=()=>explain(i+1,0);if($('#tb'))$('#tb').onclick=bookMenu;window.scrollTo(0,0)}
/* ----- opdrachten uit het boek ----- */
function bookMenu(){S.mode='';stopSpeech();topbar(true);setProg(null);
  const pages=[...new Set(BOOK.map(b=>b.page))];
  let h='<div class="card"><h1>Opdrachten uit je boek</h1><div class="where">Pak je boek. Zoek <b>'+PAD+'</b>. Kies hieronder de opdracht waar je mee bezig bent.</div>';
  pages.forEach(pg=>{h+='<h3>Bladzijde '+pg+'</h3><div class="lv">'+BOOK.filter(b=>b.page===pg).map(b=>'<button class="lvb bk" data-id="'+b.id+'" type="button"><span class="lvn" style="font-size:.95rem">'+b.nr+'</span><span><b>Opdracht '+b.nr+'</b><small>'+b.title+'</small></span><span class="st">'+(DB.book[b.id]?'✓':'')+'</span></button>').join('')+'</div>'});
  h+='<div class="row"><button class="btn alt" id="mn" type="button">← Menu</button></div></div>';
  stage.innerHTML=h;$$('.lvb[data-id]').forEach(b=>b.onclick=()=>bookEx(b.dataset.id));$('#mn').onclick=menu;window.scrollTo(0,0)}
function bookEx(id){stopSpeech();topbar(true);setProg(null);const B=BOOK.find(x=>x.id===id),ix=BOOK.indexOf(B);let qi=0,good=0;const IMG='<a href="boek/p'+B.page+'-opdracht-'+B.nr+'.png" target="_blank" rel="noopener"><img class="bk" src="boek/p'+B.page+'-opdracht-'+B.nr+'.png" alt="Opdracht '+B.nr+' uit je boek, bladzijde '+B.page+'"></a><p class="note center" style="margin:0">Tik op de afbeelding om groter te zien.</p>';
  stage.innerHTML='<div class="card"><div class="badges"><span class="badge">Bladzijde '+B.page+'</span><span class="badge o">Opdracht '+B.nr+'</span></div><p class="note" style="margin-top:0">'+PAD+'</p><h2>'+B.title+'</h2>'
   +'<div class="where">Pak je boek. Sla open <b>bladzijde '+B.page+'</b> en zoek <b>opdracht '+B.nr+'</b>.</div>'
   +'<h3>Waar gaat het over?</h3><div class="say">'+B.about+'</div>'
   +'<h3>De opdracht uit je boek</h3>'+IMG+'<p class="note center">Zo staat de opdracht in je boek. Het antwoord staat er niet bij.</p>'
   +'<h3>Zo denk je</h3>'+B.think.map((t,i)=>'<div class="stp"><span class="n">'+(i+1)+'</span><span>'+t+'</span></div>').join('')
   +'<div class="row"><span id="lis"></span></div><h3>Nu jij</h3><div id="qz"></div>'
   +'<div class="row sp" style="margin-top:18px"><button class="btn alt small" id="bl" type="button">← Alle opdrachten</button>'+(ix<BOOK.length-1?'<button class="btn alt small" id="nn" type="button">Volgende opdracht →</button>':'')+'</div></div>';
  $('#lis').appendChild(listenBtn(say(B.title+'. '+B.about+' Zo denk je. '+B.think.join(' '))));
  const qz=$('#qz');
  function showQ(){const q=B.qs[qi];S.bq={B:B.id,qi};
    qz.innerHTML='<div class="qhead"><span>Opdracht '+B.nr+' · vraag '+q.lab+'</span><span>Stap '+(qi+1)+' van '+B.qs.length+'</span></div>'+IMG+(q.fig&&q.fig!==B.fig?'<div>'+q.fig()+'</div>':'')+'<div class="q">'+q.text+'</div><div class="opts" id="bo">'+shuffle(q.opts).map((o,i)=>'<button class="opt" type="button" data-ok="'+(o.ok?1:0)+'">'+o.t+'</button>').join('')+'</div><div id="bf"></div><div class="row"><span id="bl2"></span><button class="btn good" id="bn" type="button" hidden>'+(qi<B.qs.length-1?'Volgende vraag →':'Klaar met opdracht '+B.nr+' ✓')+'</button></div>';
    $('#bl2').appendChild(listenBtn(say(q.text)));
    $$('#bo .opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='1';sfx(ok?'ok':'no');if(ok)good++;
      $$('#bo .opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('ok')});if(!ok)b.classList.add('no');
      const right=q.opts.filter(o=>o.ok).map(o=>o.t).join(', ');
      $('#bf').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Goed zo!':'Niet goed. Het goede antwoord is: '+right)+'</div><div class="ans"><b>Waarom?</b> '+q.why+'</div>';
      $('#bn').hidden=false;$('#bn').focus()});
    $('#bn').onclick=()=>{if(qi<B.qs.length-1){qi++;showQ()}else done()}}
  function done(){DB.book[B.id]=1;save();sfx('win');qz.innerHTML='<div class="fb ok">Opdracht '+B.nr+' klaar! Je had '+good+' van '+B.qs.length+' meteen goed.</div><p>Maak nu de opdracht ook in je boek. Je weet hoe je het moet aanpakken.</p>'+(ix<BOOK.length-1?'<div class="row"><button class="btn" id="nx2" type="button">Volgende opdracht ▶</button></div>':'');
    if($('#nx2'))$('#nx2').onclick=()=>bookEx(BOOK[ix+1].id);window.scrollTo({top:$('#qz').offsetTop-200,behavior:'smooth'})}
  showQ();$('#bl').onclick=bookMenu;if($('#nn'))$('#nn').onclick=()=>bookEx(BOOK[ix+1].id);window.scrollTo(0,0)}
window.BR={S:()=>S,LV,BOOK,LIB,polyData,M,EXTRA};
if(DB.name)menu();else nameScreen();
</script></body></html>
